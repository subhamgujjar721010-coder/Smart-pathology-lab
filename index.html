<!-- =========================================================
     COLLECTION CENTRE MODULE (Add inside index.html)
     Features:
     1. Create Collection Centre ID + Access Code (e.g., CC-ROORKEE-01 / 4829)
     2. Copy / Share Centre Login Link (?cc=CC-ROORKEE-01&code=4829)
     3. Auto-lock main app in Collection Centre Mode when opened via Centre Link
     4. Tag every booked patient with Centre Name & Code, filter workload by Centre
     ========================================================= -->

<style>
  .cc-panel {
    background: #ffffff;
    border: 1px solid #cbd5e1;
    border-radius: 12px;
    padding: 16px;
    margin: 14px 0;
    font-family: Arial, Helvetica, sans-serif;
    color: #0f172a;
  }
  .cc-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    border-bottom: 2px solid #151e73;
    padding-bottom: 10px;
    margin-bottom: 14px;
  }
  .cc-title {
    margin: 0;
    font-size: 17px;
    font-weight: 800;
    color: #151e73;
  }
  .cc-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 10px;
    margin-bottom: 12px;
  }
  .cc-input {
    width: 100%;
    padding: 9px 11px;
    border: 1px solid #94a3b8;
    border-radius: 8px;
    font-size: 13.5px;
    box-sizing: border-box;
  }
  .cc-btn {
    border: none;
    border-radius: 8px;
    padding: 9px 14px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .cc-btn-primary {
    background: linear-gradient(90deg, #151e73 0%, #0b6b5c 100%);
    color: #ffffff;
  }
  .cc-btn-outline {
    background: #f8fafc;
    color: #0f172a;
    border: 1px solid #cbd5e1;
  }
  .cc-btn-danger {
    background: #fee2e2;
    color: #b91c1c;
  }
  .cc-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin-top: 10px;
  }
  .cc-table th {
    background: #151e73;
    color: #ffffff;
    text-align: left;
    padding: 8px 10px;
  }
  .cc-table td {
    padding: 8px 10px;
    border-bottom: 1px solid #e2e8f0;
  }
  .cc-banner-bar {
    background: linear-gradient(90deg, #151e73 0%, #0b6b5c 100%);
    color: #ffffff;
    padding: 10px 14px;
    border-radius: 8px;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    font-size: 13px;
    font-weight: 700;
  }
</style>

<!-- Banner shown automatically when opened via Collection Centre Link -->
<div id="ccActiveBanner" class="cc-banner-bar" style="display:none;">
  <span id="ccActiveLabel">Collection Centre Mode</span>
  <button type="button" class="cc-btn cc-btn-outline" onclick="exitCollectionCentreMode()">Admin Login</button>
</div>

<!-- Admin Section: Manage Collection Centres -->
<div id="ccAdminSection" class="cc-panel">
  <div class="cc-header">
    <h3 class="cc-title">Collection Centres &amp; Access Codes</h3>
    <span style="font-size:12px;color:#475569;font-weight:700;">Share link + code to give centre access</span>
  </div>

  <div class="cc-grid">
    <input id="ccNameInput" class="cc-input" type="text" placeholder="Centre Name (e.g. Civil Lines Centre)" />
    <input id="ccIdInput" class="cc-input" type="text" placeholder="Centre ID (e.g. CC-01)" />
    <input id="ccCodeInput" class="cc-input" type="text" placeholder="4-Digit Access Code (e.g. 4829)" />
    <input id="ccPhoneInput" class="cc-input" type="text" placeholder="Centre Mobile No." />
  </div>

  <div style="display:flex;gap:8px;flex-wrap:wrap;">
    <button type="button" class="cc-btn cc-btn-primary" onclick="addCollectionCentre()">+ Add Collection Centre</button>
    <button type="button" class="cc-btn cc-btn-outline" onclick="generateRandomCcCode()">Generate Random Code</button>
  </div>

  <div style="overflow-x:auto;">
    <table class="cc-table">
      <thead>
        <tr>
          <th>Centre Name</th>
          <th>Centre ID</th>
          <th>Access Code</th>
          <th>Mobile</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="ccListBody"></tbody>
    </table>
  </div>
</div>

<script>
  const CC_STORAGE_KEY = "spl_collection_centres_v1";
  const CC_SESSION_KEY = "spl_active_cc_session";

  function getCollectionCentres() {
    try {
      return JSON.parse(localStorage.getItem(CC_STORAGE_KEY) || "[]");
    } catch (e) {
      return [];
    }
  }

  function saveCollectionCentres(list) {
    localStorage.setItem(CC_STORAGE_KEY, JSON.stringify(list));
  }

  function generateRandomCcCode() {
    const code = Math.floor(1000 + Math.random() * 9000);
    document.getElementById("ccCodeInput").value = String(code);
  }

  function addCollectionCentre() {
    const name = document.getElementById("ccNameInput").value.trim();
    const id = document.getElementById("ccIdInput").value.trim().toUpperCase();
    const code = document.getElementById("ccCodeInput").value.trim();
    const phone = document.getElementById("ccPhoneInput").value.trim();

    if (!name || !id || !code) {
      alert("Centre Name, Centre ID, aur Access Code bharna zaroori hai.");
      return;
    }

    const list = getCollectionCentres().filter((c) => c.id !== id);
    list.push({ name, id, code, phone, createdAt: new Date().toISOString() });
    saveCollectionCentres(list);

    document.getElementById("ccNameInput").value = "";
    document.getElementById("ccIdInput").value = "";
    document.getElementById("ccCodeInput").value = "";
    document.getElementById("ccPhoneInput").value = "";
    renderCollectionCentres();
  }

  function deleteCollectionCentre(id) {
    if (!confirm("Is Collection Centre ko delete karna hai?")) return;
    const list = getCollectionCentres().filter((c) => c.id !== id);
    saveCollectionCentres(list);
    renderCollectionCentres();
  }

  function buildCentreShareUrl(centre) {
    const baseUrl = window.location.origin + window.location.pathname;
    return (
      baseUrl +
      "?cc=" +
      encodeURIComponent(centre.id) +
      "&name=" +
      encodeURIComponent(centre.name) +
      "&code=" +
      encodeURIComponent(centre.code)
    );
  }

  function copyCentreLink(id) {
    const centre = getCollectionCentres().find((c) => c.id === id);
    if (!centre) return;
    const link = buildCentreShareUrl(centre);
    const msg =
      "Smart Pathology Lab — Collection Centre Access\n" +
      "Centre: " + centre.name + " (" + centre.id + ")\n" +
      "Access Code: " + centre.code + "\n" +
      "Link: " + link;

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(msg).then(() => {
        alert("Centre Link aur Code copy ho gaya! WhatsApp par share kar dein.");
      });
    } else {
      prompt("Yeh link aur code copy karein:", msg);
    }
  }

  function renderCollectionCentres() {
    const tbody = document.getElementById("ccListBody");
    if (!tbody) return;
    const list = getCollectionCentres();
    tbody.innerHTML = "";

    if (list.length === 0) {
      tbody.innerHTML =
        '<tr><td colspan="5" style="color:#64748b;text-align:center;">Abhi koi Collection Centre add nahi hai.</td></tr>';
      return;
    }

    list.forEach((c) => {
      tbody.innerHTML +=
        "<tr>" +
        "<td><strong>" + c.name + "</strong></td>" +
        "<td>" + c.id + "</td>" +
        "<td><code>" + c.code + "</code></td>" +
        "<td>" + (c.phone || "-") + "</td>" +
        '<td style="display:flex;gap:6px;flex-wrap:wrap;">' +
        '<button type="button" class="cc-btn cc-btn-primary" onclick="copyCentreLink(\'' + c.id + '\')">Copy Link &amp; Code</button>' +
        '<button type="button" class="cc-btn cc-btn-danger" onclick="deleteCollectionCentre(\'' + c.id + '\')">Delete</button>' +
        "</td>" +
        "</tr>";
    });
  }

  function checkCollectionCentreAccess() {
    const params = new URLSearchParams(window.location.search);
    const ccId = params.get("cc");
    const ccCode = params.get("code");
    const ccName = params.get("name") || ccId;

    if (ccId && ccCode) {
      const entered = prompt("Collection Centre (" + ccName + ") ka Access Code dalein:", ccCode);
      if (entered !== ccCode) {
        alert("Galat Access Code!");
        return;
      }
      sessionStorage.setItem(CC_SESSION_KEY, JSON.stringify({ id: ccId, name: ccName, code: ccCode }));
    }

    const activeRaw = sessionStorage.getItem(CC_SESSION_KEY);
    if (activeRaw) {
      const active = JSON.parse(activeRaw);
      const banner = document.getElementById("ccActiveBanner");
      const label = document.getElementById("ccActiveLabel");
      const adminBox = document.getElementById("ccAdminSection");
      if (banner && label) {
        banner.style.display = "flex";
        label.textContent = "Collection Centre: " + active.name + " (" + active.id + ")";
      }
      if (adminBox) adminBox.style.display = "none";
      window.ACTIVE_COLLECTION_CENTRE = active;
    }
  }

  function exitCollectionCentreMode() {
    sessionStorage.removeItem(CC_SESSION_KEY);
    window.location.href = window.location.origin + window.location.pathname;
  }

  renderCollectionCentres();
  checkCollectionCentreAccess();
</script>
